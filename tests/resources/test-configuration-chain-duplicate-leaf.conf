[ProxyServer]
name=test-nymea-remoteproxy
writeLogs=false
logFile=/var/log/nymea-remoteproxy-faulty.log
monitorSocket=/tmp/nymea-remoteproxy-test.sock

[SSL]
certificate=:/test-certificate.crt
certificateKey=:/test-certificate.key
# Fullchain-style bundle: leaf + intermediate (like cert-manager/certbot
# bundles). The duplicate leaf must be filtered out by the configuration
# loader and the resulting chain must stay [leaf, intermediate].
certificateChain=:/test-chain-fullchain-bundle.crt

[UnixSocketServerTunnelProxy]
unixSocketFileName=/tmp/nymea-remoteproxy.socket

[WebSocketServerTunnelProxy]
host=127.0.0.1
port=2212

[TcpServerTunnelProxy]
host=127.0.0.1
port=2213
